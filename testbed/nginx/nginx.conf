events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    server {
        listen 80;
        server_name localhost;

        # Standard upstream proxy
        location / {
            proxy_pass http://toy_api:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Simulated short proxy timeout (5s) returning HTML 504
        location /fault/timeout-5s/ {
            proxy_pass http://toy_api:8000/;
            proxy_read_timeout 5s;
            proxy_connect_timeout 5s;
            proxy_intercept_errors on;
            error_page 504 /504.html;
        }

        # Simulated 502 Bad Gateway with immediate upstream failure
        location /fault/502/ {
            return 502 "<html><head><title>502 Bad Gateway</title></head><body><center><h1>502 Bad Gateway</h1></center><hr><center>nginx/1.24.0</center></body></html>";
            add_header Content-Type text/html;
            add_header Server "nginx/1.24.0";
        }

        # Simulated Gateway 429 with Retry-After and Cloudflare-style headers
        location /fault/gateway-429/ {
            return 429 "<html><head><title>429 Too Many Requests</title></head><body><center><h1>Error 429 - Rate Limited by Cloudflare Edge</h1></center></body></html>";
            add_header Content-Type text/html;
            add_header Retry-After "60";
            add_header CF-Ray "8294a2b1c8f0-DFW";
            add_header Server "cloudflare";
        }

        location = /504.html {
            internal;
            return 504 "<html><head><title>504 Gateway Time-out</title></head><body><center><h1>504 Gateway Time-out</h1></center><hr><center>nginx/1.24.0</center></body></html>";
            add_header Content-Type text/html;
        }
    }
}
