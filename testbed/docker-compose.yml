version: '3.8'

services:
  toy_api:
    build:
      context: ./toy_api
      dockerfile: Dockerfile
    container_name: layers_toy_api
    ports:
      - "8000:8000"
    environment:
      - PORT=8000

  nginx:
    image: nginx:alpine
    container_name: layers_nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - toy_api
