id: S02_invalid_key
group: credentials
description: "API key is completely invalid or revoked"
faults:
  auth_token: "invalid_key"
request:
  method: GET
  url: "https://api.example.com/v1/data"
  headers:
    Authorization: "Bearer [REDACTED]"
response:
  status: 401
  headers:
    Content-Type: "application/json"
  body: '{"error": "Invalid API key"}'
expected:
