[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "layers"
version = "0.1.0"
description = "Evidence-backed API failure diagnosis CLI and library"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "layers contributors" }]
requires-python = ">=3.11"
keywords = ["api", "debugging", "diagnosis", "networking", "http"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Debuggers",
]
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "pydantic>=2.5",
    "pydantic-settings>=2.0",
    "httpx>=0.27",
    "dnspython>=2.6",
    "PyYAML>=6",
    "cryptography>=42",
    "pyOpenSSL>=24",
]

[project.optional-dependencies]
llm = ["openai>=1.30"]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-httpx>=0.30",
    "hypothesis>=6",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.scripts]
layers = "layers.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/layers"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true

[[tool.mypy.overrides]]
module = "yaml"
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
